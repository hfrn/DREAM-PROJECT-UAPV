<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DREAM — Digital Romanticism</title>

<!--
  ==========================================================================
  DREAM — page d'accueil thématique (version enrichie)
  --------------------------------------------------------------------------
  Portage Astro suggéré :
    - <section class="hero">           -> Hero.astro
    - #overlay / #panel                -> ThemePanel.astro (island interactif)
    - poets / themes / glossary (JS)   -> content collections ou JSON importé
    - functions.php                    -> backend WordPress séparé
      (si tu restes sur Astro plutôt que WordPress, remplace les appels
      fetch('/wp-admin/admin-ajax.php') de script.js par tes propres
      endpoints, ex. /api/reviews avec un adapter serveur Astro).
  ==========================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;0,600;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<section class="hero" id="hero">
  <div class="sky-photo" id="skyPhoto"></div>
  <div class="sky-overlay"></div>

  <div class="hero-chrome">
    <div class="wordmark">DREAM<small>Projet réalisé par Fernandez H. dans le cadre du Master TCMN</small></div>
    <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="false" aria-label="Activer l'ambiance sonore (chants d'oiseaux)">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/>
        <path class="wave" d="M15.3 8.7a5 5 0 0 1 0 6.6" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <path class="wave" d="M17.9 6.1a8.6 8.6 0 0 1 0 11.8" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </svg>
      <span>Ambiance</span>
    </button>
    <div class="hero-title">
      <h1>DREAM</h1>
      <p>Digital Romanticism : Échanges, Adaptations &amp; Médiations</p>
      <button class="pill-btn hero-cta" id="navAuthors">Tous les auteurs</button>
    </div>
    <div class="hero-hint">Déplacez le curseur sur l'écran &amp; cliquez sur une étoile jaune</div>
  </div>

  <audio id="ambientAudio" loop preload="none">
    <source src="assets/audio/birds-tree.ogg" type="audio/ogg">
    <source src="assets/audio/birds-tree.mp3" type="audio/mpeg">
  </audio>

  <!-- Les étoiles thématiques et filantes sont injectées en JS -->
</section>

<div class="hero-divider" id="heroDivider" aria-hidden="true">
  <svg class="divider-spark" id="dividerSpark" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <path d="M100,10 Q125,75 190,100 Q125,125 100,190 Q75,125 10,100 Q75,75 100,10 Z"/>
  </svg>
</div>

<section class="authors-section" id="authorsSection">
  <!-- Rempli en JS : titre, filtres, grille des auteurs -->
</section>

<div class="overlay" id="overlay"></div>
<div class="panel" id="panel">
  <button class="panel-close" id="panelClose" aria-label="Fermer">
  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
    <path d="M5 5 L19 19 M19 5 L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </svg>
</button>
  <div class="panel-content" id="panelBody"></div>
</div>

<script src="script.js"></script>
</body>
</html>
